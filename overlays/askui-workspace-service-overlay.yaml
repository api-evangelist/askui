overlay: 1.0.0
info:
  title: API Evangelist enhancements for AskUI Workspaces API
  version: 1.0.0
extends: openapi/askui-workspace-service-openapi-original.json
actions:
- target: $.info
  update:
    x-apievangelist-provider: askui
    x-apievangelist-service: workspace-service
    x-apievangelist-docs: https://docs.askui.com/04-reference/07-workspace-service
    x-agentic-access: agentic-access/askui-agentic-access.yml
- target: $.servers
  description: The AskUI Workspaces API is served from workspaces.askui.com (base host
    absent from the published spec).
  update:
  - url: https://workspaces.askui.com
    description: Production
