aid: askui
name: AskUI
description: >-
  AskUI is a German (Karlsruhe-based) company building agentic test automation
  and computer-use agents for any interface. Its vision agents observe the
  screen, reason, and act — clicking, typing, and extracting data without DOM
  queries or brittle UI selectors — across Windows, macOS, Linux, Android, iOS,
  and embedded/HMI systems. The platform ships a Python Vision Agent SDK, a
  TypeScript SDK, the AskUI Suite (AgentOS runtime + AskUI Development
  Environment PowerShell CLI), and the AskUI Hub management console. Developers
  drive it programmatically through the AskUI Workspaces API — an OpenAPI 3.1
  REST service for workspaces, agents, agent executions, access tokens,
  schedules, runs, files, usage, and billing. AskUI GmbH is ISO/IEC 27001:2022
  certified and GDPR-aligned. Surfaced as a Seedcamp portfolio company and
  enriched into the API Evangelist network.
